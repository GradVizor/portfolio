<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0e17"/>
      <stop offset="0.55" stop-color="#0a0a11"/>
      <stop offset="1" stop-color="#060609"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.28" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.74" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="0.65" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#8b5cf6" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="320" fill="url(#base)"/>
  <rect width="800" height="320" fill="url(#grid)"/>
  <rect width="800" height="320" fill="url(#glowV)"/>
  <rect width="800" height="320" fill="url(#glowC)"/>

  <!-- signal arcs from left node -->
  <g fill="none" stroke="#22d3ee" stroke-opacity="0.5">
    <circle cx="150" cy="150" r="34" stroke-width="1.5"/>
    <circle cx="150" cy="150" r="58" stroke-width="1" stroke-opacity="0.35"/>
    <circle cx="150" cy="150" r="84" stroke-width="1" stroke-opacity="0.2"/>
  </g>
  <circle cx="150" cy="150" r="7" fill="#22d3ee"/>
  <circle cx="150" cy="150" r="12" fill="none" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- trajectory to right node -->
  <path d="M 162 142 C 300 60, 460 220, 640 130" fill="none" stroke="#a78bfa" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="7 6"/>
  <circle cx="640" cy="130" r="6" fill="#e879f9"/>
  <circle cx="640" cy="130" r="14" fill="none" stroke="#e879f9" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="400" cy="138" r="4" fill="#8b5cf6"/>
  <circle cx="400" cy="138" r="10" fill="none" stroke="#8b5cf6" stroke-opacity="0.5"/>

  <!-- waypoint ticks -->
  <g stroke="#9aa0b8" stroke-opacity="0.4" stroke-width="1">
    <line x1="250" y1="96" x2="250" y2="108"/>
    <line x1="330" y1="112" x2="330" y2="124"/>
    <line x1="480" y1="150" x2="480" y2="162"/>
    <line x1="560" y1="138" x2="560" y2="150"/>
  </g>
  <g font-family="monospace" font-size="11" fill="#9aa0b8" fill-opacity="0.75" letter-spacing="2">
    <text x="238" y="88">WP-01</text>
    <text x="468" y="180">WP-02</text>
  </g>

  <!-- horizon -->
  <rect x="60" y="248" width="680" height="2" fill="url(#horizon)"/>
  <rect x="60" y="250" width="680" height="26" fill="#8b5cf6" opacity="0.08"/>

  <!-- perspective floor lines below horizon -->
  <g stroke="#8b5cf6" stroke-opacity="0.22" stroke-width="1">
    <line x1="400" y1="250" x2="40" y2="320"/>
    <line x1="400" y1="250" x2="200" y2="320"/>
    <line x1="400" y1="250" x2="330" y2="320"/>
    <line x1="400" y1="250" x2="470" y2="320"/>
    <line x1="400" y1="250" x2="600" y2="320"/>
    <line x1="400" y1="250" x2="760" y2="320"/>
    <line x1="120" y1="272" x2="680" y2="272"/>
    <line x1="80" y1="296" x2="720" y2="296"/>
  </g>

</svg>
